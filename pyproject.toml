[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhino-mcp"
version = "0.1.0"
description = "AI-driven Rhino 3D modeling control via MCP (Model Context Protocol)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]
http = [
    "uvicorn>=0.24.0",
    "fastapi>=0.104.0",
]

[project.scripts]
rhino-mcp = "rhino_mcp.server:main"
rhino-mcp-health = "rhino_mcp.health:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rhino_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.metadata]
allow-direct-references = true
